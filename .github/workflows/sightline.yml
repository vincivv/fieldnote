# Deploy the site to GitHub Pages, then run a Deja View visual check against the deployed version.
# The check fails when Deja View finds visual changes that need review; approve them in Deja View to accept.
name: Deploy + Deja View

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4

  sightline:
    name: Deja View visual check
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SIGHTLINE_URL: ${{ vars.SIGHTLINE_URL }}
      SIGHTLINE_TOKEN: ${{ secrets.SIGHTLINE_TOKEN }}
      SIGHTLINE_PROJECT: ${{ secrets.SIGHTLINE_PROJECT }}
      SITE_URL: ${{ needs.deploy.outputs.page_url }}
      COMMIT_MSG: ${{ github.event.head_commit.message || 'manual run' }}
    steps:
      - name: Run Deja View build
        run: |
          set -euo pipefail
          api() { curl -sS --fail-with-body -H "Authorization: Bearer $SIGHTLINE_TOKEN" -H "Content-Type: application/json" "$@"; }

          # Give the Pages CDN a moment to serve the new deploy.
          sleep 20

          LABEL="${GITHUB_SHA::7} · ${COMMIT_MSG%%$'\n'*}"
          BODY=$(jq -n --arg u "${SITE_URL%/}" --arg l "$LABEL" '{base_url: $u, label: $l}')
          RUN=$(api -X POST "$SIGHTLINE_URL/api/projects/$SIGHTLINE_PROJECT/runs" -d "$BODY" | jq -r .id)
          echo "Deja View build $RUN started for $SITE_URL"

          for i in $(seq 1 200); do
            S=$(api "$SIGHTLINE_URL/api/runs/$RUN/status")
            STATUS=$(echo "$S" | jq -r .status)
            [ "$STATUS" = done ] || [ "$STATUS" = failed ] && break
            sleep 3
          done

          RESULT=$(echo "$S" | jq -r .result)
          URL=$(echo "$S" | jq -r .url)
          C=$(echo "$S" | jq -c .counts)
          GROUPS=$(echo "$C" | jq -r '.groups // 0')
          SNAPS=$(echo "$C" | jq -r '.snapshots // 0')
          NOISE=$(echo "$C" | jq -r '.noise_ignored // 0')
          PIXELS=$(echo "$C" | jq -r '.pixel_regions // 0')

          {
            echo "## Deja View visual check"
            echo
            case "$RESULT" in
              passed|approved) echo "✅ **No visual changes** across $SNAPS snapshots." ;;
              changes) echo "🟠 **$GROUPS change group(s) need review** across $SNAPS snapshots." ;;
              *) echo "❌ **Build $RESULT.**" ;;
            esac
            echo
            echo "| Snapshots | Changes to review | Dynamic content ignored | Plain pixel diff regions |"
            echo "|---|---|---|---|"
            echo "| $SNAPS | $GROUPS | $NOISE | $PIXELS |"
            echo
            echo "[Review in Deja View →]($URL)"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Result: $RESULT · review: $URL"
          case "$RESULT" in
            passed|approved) exit 0 ;;
            changes) echo "::error title=Deja View::$GROUPS visual change group(s) need review: $URL"; exit 1 ;;
            *) echo "::error title=Deja View::Build $RESULT: $URL"; exit 1 ;;
          esac
